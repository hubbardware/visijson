[package]
name = "jsondocstore"
version = "0.1.0"
edition = "2021"
description = "In-memory JSON document store with immutable persistent tree nodes, atomic root swaps, formulas, subscriptions, and WAL persistence"
license = "MIT"

[dependencies]
arc-swap = "1"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
tokio-tungstenite = "0.23"
