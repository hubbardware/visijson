[package]
name = "visijson"
version = "0.1.0"
edition = "2021"
description = "Reactive in-memory JSON document store: spreadsheet-style formulas, live subscriptions over WebSocket/SSE, immutable persistent tree nodes with atomic root swaps, and WAL persistence"
license = "MIT"

[dependencies]
arc-swap = "1"
axum = { version = "0.7", features = ["ws"] }
fs2 = "0.4"
futures-util = "0.3"
imbl = "7.0.1"
visijson-derive = { path = "derive" }
jaq-core = "2"
jaq-json = { version = "1", features = ["serde_json"] }
jaq-std = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
sha2 = "0.10"
getrandom = "0.2"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
tokio-tungstenite = "0.23"

# Password hashing is deliberately expensive; unoptimized it would make
# every debug-build login (and test) take seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[workspace]
members = [".", "derive", "tui"]
